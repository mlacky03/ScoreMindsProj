<div class="player" tabindex="0" role="button">

  <div class="player-card-container">
    <ng-container *ngIf="!isEditing">
      <div class="player-view">
        <div class="player-info">
          <img *ngIf="player.photo; else playerFallback" [src]="player.photo" alt="{{ player.name }}"
            (error)="onImgError($event)" />
          <ng-template #playerFallback>
            <div class="fallback-icon">👤</div>
          </ng-template>
        </div>
        <span class="player-name">{{ player.name }}</span>
        <span class="player-position">{{ player.position }}</span>
      </div>

      <div class="player-actions" *ngIf="matchStatus === 'NS'">
        <div class="action-icon" (click)="startEdit('GOAL')" title="Add Goal">
          ⚽
        </div>

        <div class="action-icon" (click)="startEdit('ASSIST')" title="Add Assist">
          👟
        </div>
      </div>

      <div class="player-stats-display" *ngIf="matchStatus !== 'NS'">

        <!-- <div class="stat-badge" *ngIf="player.goals > 0" title="Goals scored">
          ⚽ <small *ngIf="player.goals > 1">x{{player.goals}}</small>
        </div>

        <div class="stat-badge" *ngIf="player.assists > 0" title="Assists made">
          👟 <small *ngIf="player.assists > 1">x{{player.assists}}</small>
        </div> -->

      </div>
    </ng-container>
    <ng-container *ngIf="isEditing">

      <div class="edit-wrapper" [formGroup]="form">
        <div class="edit-header">Adding for {{ player.name }}</div>

        <div class="controls">
          <select formControlName="type">
            <option value="GOAL">⚽ Goal</option>
            <option value="ASSIST">👟 Assist</option>
          </select>
          <input type="number" formControlName="minute" placeholder="Min">
        </div>

        <div class="edit-actions">
          <button (click)="cancelEdit()">❌</button>
          <button (click)="save()">✅</button>
        </div>
      </div>

    </ng-container>
  </div>

</div>
