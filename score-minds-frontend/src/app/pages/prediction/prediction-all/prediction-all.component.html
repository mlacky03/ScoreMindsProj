<div class="layout-container" [class.is-split-view]="isDetailsOpen()">

  <div class="list-panel">

    <div class="filter-header">
      <div class="filter-tabs">
        <button [class.active]="filterMode() === 'upcoming'" (click)="filterMode.set('upcoming'); page.set(1)">
          <i class="icon-calendar"></i> upcoming
        </button>
        <button [class.active]="filterMode() === 'history'" (click)="filterMode.set('history'); page.set(1)">
          <i class="icon-history"></i> history
        </button>
      </div>
    </div>

    @if (loading()) {
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Loading predictions...</p>
    </div>
    } @else {
    <app-prediction-list [predictions]="predictions()" [matches]="matches()"
      [mode]="isDetailsOpen() ? 'sidebar' : 'grid'" (predictionSelected)="onSelect($event.predictionId, $event.matchId)"
      [personal]="true">
    </app-prediction-list>
    <div class="pagination-controls">
      <button class="page-btn" [disabled]="page() === 1" (click)="changePage(-1)">
        <i class="icon-arrow-left"></i> Back
      </button>

      <span class="page-info">Page {{ page() }}</span>

      <button class="page-btn" [disabled]="predictions().length < pageSize()" (click)="changePage(1)">
        Forward <i class="icon-arrow-right"></i>
      </button>
    </div>
    }

  </div>

  <div class="detail-panel">
    <router-outlet (activate)="onActivate()" (deactivate)="onDeactivate()">
    </router-outlet>
  </div>

</div>
